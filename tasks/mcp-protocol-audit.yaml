apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mcp-protocol-audit
spec:
  params:
    - name: image_url
      type: string
    - name: qa_image_url
      type: string

  steps:
    - name: validate-protocol
      image: $(params.qa_image_url)
      imagePullPolicy: Always
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "--- Phase 1: Launching Server & Bridge ---"
        # 1. Start the server in the background.
        # We assume the binary 'linux-mcp-server' is in the PATH or we use the server image's path.
        # Since we are in the QA image, we may need to invoke it via 'podman' or 'chroot' 
        # but the simplest way is running it directly if the binary is present.

        # If the binary is in the server image, we run the server image as the step image:
        # For now, let's bridge stdio to TCP 8080 using the tools in this QA image.
        socat TCP-LISTEN:8080,reuseaddr,fork EXEC:linux-mcp-server,stderr &
        BRIDGE_PID=$!

        echo "--- Phase 2: Connectivity Check ---"
        MAX_RETRIES=15
        for i in $(seq 1 $MAX_RETRIES); do
          if (echo > /dev/tcp/localhost/8080) >/dev/null 2>&1; then
            echo "✅ Server Bridge is UP"
            break
          fi
          echo "Waiting for server... ($i/$MAX_RETRIES)"
          sleep 2
          if [ $i -eq $MAX_RETRIES ]; then
            echo "❌ ERROR: Server failed to bind to port 8080."
            kill $BRIDGE_PID || true
            exit 1
          fi
        done

        echo "--- Phase 3: Running Audits ---"
        /usr/local/bin/verify_stdout_hygiene.sh
        /usr/local/bin/mcp_protocol_audit.sh

        kill $BRIDGE_PID || true
