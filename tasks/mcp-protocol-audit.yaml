apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mcp-protocol-audit
spec:
  params:
    - name: image_url
      type: string
    - name: qa_image_url
      type: string

  sidecars:
    - name: mcp-server
      image: $(params.image_url)
      imagePullPolicy: Always
      command:
        - /usr/bin/socat
        - TCP-LISTEN:8080,reuseaddr,fork
        # - EXEC:"linux-mcp-server 2>/tmp/mcp.log",stderr
        - EXEC:/bin/cat

  steps:
    - name: validate-protocol
      image: $(params.qa_image_url)
      imagePullPolicy: Always
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "--- Verification: Connectivity Test ---"

        # Wait for the sidecar bridge to open
        timeout 30s bash -c 'until nc -z localhost 8080; do sleep 1; done'

        echo "Testing network bridge to sidecar..."
        # This sends 'ping', and the sidecar EXEC:/bin/cat should send it right back
        ECHO_RES=$(echo "ping" | nc -w 2 localhost 8080)

        if [ "$ECHO_RES" == "ping" ]; then
          echo "✅ Network bridge is functional (Sidecar echoed back)."
        else
          echo "❌ Network bridge failed. Received: $ECHO_RES"
          exit 1
        fi

        echo "--- Checking Scripts ---"
        ls -l /usr/local/bin/mcp_protocol_audit.sh
        ls -l /usr/local/bin/verify_stdout_hygiene.sh
