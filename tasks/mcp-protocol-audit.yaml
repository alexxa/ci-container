apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mcp-protocol-audit
spec:
  params:
    - name: image_url
      type: string
    - name: qa_image_url
      type: string

  volumes:
    - name: mcp-pipe
      emptyDir: {}

  sidecars:
    - name: mcp-server
      image: $(params.image_url)
      imagePullPolicy: Always
      volumeMounts:
        - name: mcp-pipe
          mountPath: /tmp/mcp
      env:
        - name: SSH_USER
          value: "mcp"
        - name: SSH_PORT
          value: "22"
        - name: SSH_KEY_FILE
          value: "/var/lib/mcp/.ssh/id_rsa"
        - name: LINUX_MCP_LOG_LEVEL
          value: "DEBUG" 
      command: ["/usr/local/bin/mcp_server_entrypoint.sh"] 

  steps:
    - name: validate-protocol
      image: $(params.qa_image_url)
      imagePullPolicy: Always
      volumeMounts:
        - name: mcp-pipe
          mountPath: /tmp/mcp
      script: |
        #!/usr/bin/env bash
        /usr/local/bin/mcp_protocol_audit.sh
        AUDIT_EXIT=$?

        if [ $AUDIT_EXIT -ne 0 ]; then
          echo "::error::Audit Failed! --- SERVER STDERR LOG ---"
          cat /tmp/mcp/server_stderr.log || echo "No stderr log found."
          exit $AUDIT_EXIT
        fi

        echo "✅ Task Complete."
        kill $BRIDGE_PID || true
