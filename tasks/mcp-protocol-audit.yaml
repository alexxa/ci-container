apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mcp-protocol-audit
spec:
  params:
    - name: image_url
      type: string
    - name: qa_image_url
      type: string

  sidecars:
    - name: mcp-server
      # We use the QA image so we have socat
      image: $(params.qa_image_url) 
      imagePullPolicy: Always
      # Bridge TCP 8080 directly to the server binary
      command: ["/usr/bin/socat"]
      args:
        - "TCP-LISTEN:8080,reuseaddr,fork"
        - "EXEC:linux-mcp-server,stderr"

  steps:
    - name: validate-protocol
      image: $(params.qa_image_url)
      imagePullPolicy: Always
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "--- Phase 1: Connectivity Check ---"
        # Wait for the sidecar port to be open
        timeout 60s bash -c 'until nc -z localhost 8080; do sleep 1; done' || {
          echo "❌ ERROR: Port 8080 never opened."
          exit 1
        }

        echo "--- Phase 2: Running Audits ---"
        # Directly run the audit script against the sidecar's TCP port
        /usr/local/bin/mcp_protocol_audit.sh
