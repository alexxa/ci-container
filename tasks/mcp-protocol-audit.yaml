apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mcp-protocol-audit
spec:
  params:
    - name: image_url
      type: string
    - name: qa_image_url
      type: string

  sidecars:
    - name: mcp-server
      image: $(params.image_url)
      imagePullPolicy: Always
      command:
        - /usr/bin/socat
        - TCP-LISTEN:8080,reuseaddr,fork
        #- EXEC:"/usr/local/bin/linux-mcp-server 2>/tmp/mcp.log",stderr
        #- EXEC:/bin/cat
        - EXEC:linux-mcp-server

  steps:
    - name: validate-protocol
      image: $(params.qa_image_url)
      imagePullPolicy: Always
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "--- Verification: Connectivity Test ---"

        echo "--- Local Network Check ---"
        ss -tulpn || netstat -tulpen || echo "Networking tools missing"

        # Try to connect with a 1-second timeout
        MAX_RETRIES=20
        COUNT=0
        until (echo > /dev/tcp/localhost/8080) >/dev/null 2>&1 || [ $COUNT -eq $MAX_RETRIES ]; do
          echo "Waiting for bridge (Attempt $((COUNT + 1))/$MAX_RETRIES)..."
          sleep 2
          COUNT=$((COUNT + 1))
        done

        if [ $COUNT -eq $MAX_RETRIES ]; then
          echo "❌ ERROR: Port 8080 never opened."
          echo "--- Server Startup Logs ---"
          # Sidecars share the same /tmp if configured, or we can use common volumes.
          # For now, let's just check if the process is even visible.
          ps aux | grep mcp || echo "Server process not found in process table."
          exit 1
        fi

        echo "Testing network bridge to sidecar..."
        # Use a hard timeout for the actual data exchange
        ECHO_RES=$(timeout 5s bash -c "echo 'ping' | nc localhost 8080") || {
          echo "❌ ERROR: Sidecar did not respond within 5 seconds."
          exit 1
        }
