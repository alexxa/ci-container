apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mcp-protocol-audit
spec:
  params:
    - name: image_url
      type: string
    - name: qa_image_url
      type: string

  volumes:
    - name: mcp-pipe
      emptyDir: {}

  sidecars:
    - name: mcp-server
      image: $(params.image_url)
      imagePullPolicy: Always
      volumeMounts:
        - name: mcp-pipe
          mountPath: /tmp/mcp
      # We use pipes so the server can run without socat
      command: ["/bin/bash", "-c"]
      args:
        - |
          mkfifo /tmp/mcp/in /tmp/mcp/out
          # Keep the pipe open even if the bridge disconnects
          while true; do
            linux-mcp-server < /tmp/mcp/in > /tmp/mcp/out 2>/tmp/mcp/err
          done

  steps:
    - name: validate-protocol
      image: $(params.qa_image_url)
      imagePullPolicy: Always
      volumeMounts:
        - name: mcp-pipe
          mountPath: /tmp/mcp
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "--- Phase 1: Establishing Bridge ---"
        # Since this image HAS socat, we bridge the files to TCP 8080
        # We use a loop to wait for the sidecar to create the pipes
        until [ -p /tmp/mcp/in ]; do sleep 1; done

        # Start socat bridge in background
        #socat TCP-LISTEN:8080,reuseaddr,fork SYSTEM:'cat > /tmp/mcp/in | tail -f /tmp/mcp/out | grep --line-buffered "{"' &
        #socat TCP-LISTEN:8080,reuseaddr,fork SYSTEM:'cat > /tmp/mcp/in | tail -f /tmp/mcp/out' &
        # We escape the { so socat doesn't try to parse it as a group
        socat TCP-LISTEN:8080,reuseaddr,fork SYSTEM:'cat > /tmp/mcp/in | tail -f /tmp/mcp/out | grep --line-buffered "\{"' &
        BRIDGE_PID=$!

        echo "--- Phase 2: Connectivity Check ---"
        timeout 30s bash -c 'until nc -z localhost 8080; do sleep 1; done'

        echo "--- Phase 3: Running Audits ---"
        /usr/local/bin/verify_stdout_hygiene.sh
        /usr/local/bin/mcp_protocol_audit.sh

        kill $BRIDGE_PID || true
